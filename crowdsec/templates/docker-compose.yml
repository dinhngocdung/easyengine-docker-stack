name: crowdsec
services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    environment:
      COLLECTIONS: ${CROWDSEC_COLLECTIONS}
      TZ: ${CROWDSEC_TZ}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/etc/crowdsec
      - ./data:/var/lib/crowdsec/data
      - ${CROWDSEC_SSHD_LOG_PATH}:/var/log/host-auth:ro
      - ${CROWDSEC_NGINX_PROXY_LOG_DIR}:/var/log/nginx-proxy:ro
    restart: unless-stopped

  fw-bouncer:
    image: ${FW_BOUNCER_IMAGE}
    container_name: crowdsec-fw-bouncer
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    depends_on:
      - crowdsec
    environment:
      API_URL: ${CROWDSEC_FW_API_URL}
      API_KEY: ${CROWDSEC_FW_BOUNCER_KEY}
    volumes:
      - ./data-bouncers/fw-bouncer.yaml:/config/crowdsec-firewall-bouncer.yaml:ro
    restart: unless-stopped

  cloudflare-worker-bouncer:
    image: crowdsecurity/cloudflare-worker-bouncer:latest
    container_name: crowdsec-cf-worker-bouncer
    depends_on:
      - crowdsec
    volumes:
      - ./data-bouncers/cf-worker-bouncer.yaml:/etc/crowdsec/bouncers/crowdsec-cloudflare-worker-bouncer.yaml:ro
    restart: unless-stopped

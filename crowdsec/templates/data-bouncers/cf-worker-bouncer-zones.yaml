            # ==== Danh sách zone Cloudflare cần bảo vệ ====
            # Đây là file bạn sửa khi thêm site mới — không cần đụng vào script
            # hay các file khác. Copy đúng khối bên dưới, đổi zone_id + domain.
            #
            # action: "captcha" (Turnstile, cần khối turnstile bên dưới)
            #      hoặc "block" (chặn hẳn — nếu dùng "block" thì XOÁ khối turnstile)
            #
            # Lưu ý gói Cloudflare Free: chỉ 1 action áp dụng được cho toàn zone,
            # không mix block/captcha cùng lúc trên 1 zone ở gói Free.

            - zone_id: "REPLACE_WITH_REAL_ZONE_ID" # example.com
              actions:
                - captcha
              default_action: captcha
              routes_to_protect:
                - '*example.com/*'
              turnstile:
                enabled: true
                rotate_secret_key: true
                rotate_secret_key_every: 168h0m0s
                mode: managed

mode: iptables
pid_dir: /var/run/
update_frequency: 10s
log_mode: stdout
log_level: info
api_url: ${API_URL}
api_key: ${API_KEY}
disable_ipv6: false
deny_action: DROP
deny_log: false
supported_decisions_types:
  - ban
ipset_type: nethash
iptables_chains:
  - INPUT
  - DOCKER-USER
iptables_add_rule_comments: true
prometheus:
  enabled: false
  listen_addr: 127.0.0.1
